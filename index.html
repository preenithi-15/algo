<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Algo Trading Innovation Challenge — Interactive Audio Presentation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f17;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Fixed top navigation bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 23, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .top-bar-title {
      display: flex;
      flex-direction: column;
    }

    .top-bar-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #ffffff;
    }

    .top-bar-title span {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .slide-quicknav {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      padding: 0.2rem;
    }

    .nav-dot {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      font-size: 0.75rem;
      font-weight: 600;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .nav-dot:hover, .nav-dot.active {
      background: #f97316;
      border-color: #fb923c;
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Main Container */
    #slides-container {
      max-width: 1100px;
      margin: 1.5rem auto 5rem;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
    }

    .slide-card {
      background: #111827;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid #1f2937;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
      position: relative;
    }

    .slide-card:hover {
      border-color: #374151;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .slide-card.focused {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.3), 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    /* Slide Header */
    .slide-card-header {
      background: #182234;
      padding: 0.65rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
    }

    .slide-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f97316;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .slide-status {
      font-size: 0.72rem;
      color: #94a3b8;
      background: #0f172a;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid #1e293b;
    }

    /* Slide image viewport */
    .slide-img-box {
      position: relative;
      width: 100%;
      background: #000;
      line-height: 0;
    }

    .slide-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Play Button Floating Overlay */
    .slide-play-overlay {
      position: absolute;
      bottom: 22px;
      right: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      z-index: 10;
      background: rgba(4, 7, 12, 0.88);
      border: 2px solid #f97316;
      border-radius: 50px;
      padding: 6px 8px 6px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 0 0 rgba(249, 115, 22, 0.6);
      transition: all 0.2s ease;
      animation: pulse-border 2.2s infinite;
      text-decoration: none;
    }

    @keyframes pulse-border {
      0%   { box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 0 0 rgba(249,115,22,0.6); }
      70%  { box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 0 12px rgba(249,115,22,0); }
      100% { box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 0 0 rgba(249,115,22,0); }
    }

    .slide-play-overlay:hover {
      transform: scale(1.05);
      background: #04070c;
      border-color: #fb923c;
    }

    .play-text {
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0.2px;
      user-select: none;
    }

    .play-btn-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ea580c;
    }

    .play-btn-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Audio Player Bar */
    .audio-player-bar {
      background: #0a0f19;
      border-top: 1px solid #1f2937;
      padding: 0.85rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: background 0.3s;
    }

    .slide-card.playing .audio-player-bar {
      background: #0e1b2e;
      border-top: 1px solid #2563eb;
    }

    .audio-badge {
      font-size: 0.78rem;
      font-weight: 700;
      color: #f97316;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-player-bar audio {
      flex: 1;
      height: 40px;
      accent-color: #f97316;
    }

    @media (max-width: 640px) {
      .top-bar-title h1 { font-size: 0.9rem; }
      .play-text { font-size: 0.75rem; }
      .play-btn-circle { width: 36px; height: 36px; }
      .slide-play-overlay { bottom: 12px; right: 12px; padding: 4px 6px 4px 12px; }
      .audio-badge { display: none; }
    }
  </style>
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="top-bar">
    <div class="top-bar-title">
      <h1>The Algo Trading Innovation Challenge</h1>
      <span>STRATASCOPE · Techfest × Delta Exchange</span>
    </div>
    <div class="slide-quicknav" id="nav-dots">
      <!-- 10 dots injected by JS -->
    </div>
  </header>

  <!-- Slide Cards -->
  <main id="slides-container"></main>

  <script>
    const TOTAL_SLIDES = 10;
    const container = document.getElementById('slides-container');
    const navDots = document.getElementById('nav-dots');
    
    // Check URL parameters for ?slide=N
    const urlParams = new URLSearchParams(window.location.search);
    const targetSlide = parseInt(urlParams.get('slide')) || null;

    let activeAudio = null;
    let activeCard = null;

    // Create 10 slide cards
    for (let i = 1; i <= TOTAL_SLIDES; i++) {
      // 1. Add top nav dot
      const dot = document.createElement('a');
      dot.className = 'nav-dot';
      dot.href = `#slide-${i}`;
      dot.textContent = i;
      dot.title = `Jump to Slide ${i}`;
      dot.id = `dot-${i}`;
      dot.addEventListener('click', (e) => {
        e.preventDefault();
        playSlide(i);
      });
      navDots.appendChild(dot);

      // 2. Add slide card
      const card = document.createElement('div');
      card.className = 'slide-card';
      card.id = `slide-${i}`;

      card.innerHTML = `
        <div class="slide-card-header">
          <div class="slide-tag">
            <span>●</span> Slide ${i} of ${TOTAL_SLIDES}
          </div>
          <div class="slide-status" id="status-${i}">Ready to listen</div>
        </div>
        <div class="slide-img-box">
          <img class="slide-img" src="slides_img/slide_${i}.png" alt="Slide ${i}" loading="${i <= 2 ? 'eager' : 'lazy'}">
          <div class="slide-play-overlay" id="overlay-${i}" title="Click to listen to the team explain slide ${i}">
            <span class="play-text">Click to listen to the team explain</span>
            <div class="play-btn-circle">
              <img src="play button.jpeg" alt="Play">
            </div>
          </div>
        </div>
        <div class="audio-player-bar">
          <div class="audio-badge">
            <span>🎙️</span> Slide ${i} Audio
          </div>
          <audio id="audio-${i}" controls preload="metadata" src="${i}.ogg"></audio>
        </div>
      `;

      container.appendChild(card);

      // Click event for play button on the slide
      const overlay = card.querySelector(`#overlay-${i}`);
      overlay.addEventListener('click', () => {
        playSlide(i);
      });

      // Audio event listeners
      const audioEl = card.querySelector(`#audio-${i}`);
      const statusEl = card.querySelector(`#status-${i}`);

      audioEl.addEventListener('play', () => {
        // Pause any other audio
        if (activeAudio && activeAudio !== audioEl) {
          activeAudio.pause();
        }
        if (activeCard && activeCard !== card) {
          activeCard.classList.remove('playing');
        }
        activeAudio = audioEl;
        activeCard = card;
        card.classList.add('playing');
        statusEl.textContent = '🔊 Playing team audio...';
        statusEl.style.color = '#38bdf8';
        updateNavDot(i);
      });

      audioEl.addEventListener('pause', () => {
        if (activeAudio === audioEl) {
          card.classList.remove('playing');
          statusEl.textContent = 'Audio paused';
          statusEl.style.color = '#94a3b8';
        }
      });

      audioEl.addEventListener('ended', () => {
        card.classList.remove('playing');
        statusEl.textContent = '✓ Finished';
        statusEl.style.color = '#4ade80';
      });
    }

    function updateNavDot(num) {
      document.querySelectorAll('.nav-dot').forEach(d => d.classList.remove('active'));
      const activeDot = document.getElementById(`dot-${num}`);
      if (activeDot) activeDot.classList.add('active');
    }

    function playSlide(num) {
      const card = document.getElementById(`slide-${num}`);
      const audio = document.getElementById(`audio-${num}`);
      if (!card || !audio) return;

      document.querySelectorAll('.slide-card').forEach(c => c.classList.remove('focused'));
      card.classList.add('focused');

      // Smooth scroll to slide
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // Play audio
      setTimeout(() => {
        audio.play().catch(e => console.log('Audio autoplay prevented, user click required:', e));
      }, 400);

      updateNavDot(num);
    }

    // Auto-scroll and auto-play if ?slide=N in URL
    if (targetSlide && targetSlide >= 1 && targetSlide <= TOTAL_SLIDES) {
      window.addEventListener('load', () => {
        setTimeout(() => {
          playSlide(targetSlide);
        }, 300);
      });
    }
  </script>
</body>
</html>
