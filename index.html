<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Algo Trading Innovation Challenge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
      background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #1565c0 100%);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    header h1 {
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    header p {
      margin-top: 0.4rem;
      font-size: 0.9rem;
      opacity: 0.75;
    }

    #loading {
      text-align: center;
      padding: 4rem 2rem;
      font-size: 1.1rem;
      color: #8b949e;
    }

    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #slides-container {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .slide-wrapper {
      position: relative;
      background: #161b22;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid #30363d;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .slide-wrapper.highlighted {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88,166,255,0.3), 0 12px 48px rgba(88,166,255,0.2);
    }

    .slide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      background: #21262d;
      border-bottom: 1px solid #30363d;
    }

    .slide-number {
      font-size: 0.8rem;
      font-weight: 600;
      color: #58a6ff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      background: #fff;
    }

    .slide-canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---- Play button overlay ---- */
    .play-overlay {
      position: absolute;
      bottom: 18px;
      right: 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      cursor: pointer;
      z-index: 10;
    }

    .listen-label {
      background: rgba(0,0,0,0.78);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      pointer-events: none;
      animation: pulse-label 2.2s ease-in-out infinite;
      letter-spacing: 0.3px;
    }

    @keyframes pulse-label {
      0%, 100% { opacity: 1; transform: translateX(0); }
      50%       { opacity: 0.75; transform: translateX(-3px); }
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 0 rgba(88,166,255,0.6);
      transition: transform 0.2s ease;
      animation: pulse-ring 2s ease-out infinite;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 0   rgba(88,166,255,0.6); }
      70%  { box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 14px rgba(88,166,255,0); }
      100% { box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 0   rgba(88,166,255,0); }
    }

    .play-btn:hover { transform: scale(1.12); animation: none; }

    .play-btn img { width: 100%; height: 100%; object-fit: cover; }

    /* ---- Audio player panel ---- */
    .audio-panel {
      display: none;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #0d1117;
      border-top: 1px solid #30363d;
    }

    .audio-panel.visible { display: flex; }

    .audio-label {
      font-size: 0.8rem;
      color: #58a6ff;
      font-weight: 600;
      white-space: nowrap;
    }

    .audio-panel audio {
      flex: 1;
      height: 36px;
      accent-color: #58a6ff;
    }

    .close-audio {
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }
    .close-audio:hover { color: #e6edf3; background: #21262d; }

    @media (max-width: 600px) {
      .play-btn { width: 44px; height: 44px; }
      .listen-label { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>The Algo Trading Innovation Challenge</h1>
  <p>Click the play button on any slide to hear the team explain</p>
</header>

<div id="loading">
  <div class="spinner"></div>
  <p>Loading presentation slides&hellip;</p>
</div>

<div id="slides-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // Read ?slide=N from the URL
  const params     = new URLSearchParams(window.location.search);
  const targetSlide = parseInt(params.get('slide')) || null;

  const PDF_URL   = 'The%20Algo%20Trading%20Innovation%20Challenge.pdf';
  const container = document.getElementById('slides-container');
  const loadingEl = document.getElementById('loading');

  let currentAudio = null;
  const slideWrappers = [];   // indexed 0-based

  async function loadPDF() {
    try {
      const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
      const totalPages = pdf.numPages;
      loadingEl.style.display = 'none';

      for (let n = 1; n <= totalPages; n++) {
        await renderSlide(pdf, n, totalPages);
      }

      // After all slides are rendered, handle ?slide= targeting
      if (targetSlide && targetSlide >= 1 && targetSlide <= totalPages) {
        const idx = targetSlide - 1;
        const wrapper = slideWrappers[idx];
        if (wrapper) {
          wrapper.classList.add('highlighted');
          wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });

          // Auto-open and play the audio for that slide
          const audioPanel = wrapper.querySelector('.audio-panel');
          const audioEl    = wrapper.querySelector('audio');
          if (audioPanel && audioEl) {
            setTimeout(() => {
              audioPanel.classList.add('visible');
              audioEl.play().catch(() => {});
              currentAudio = audioEl;
            }, 800); // small delay to let the scroll settle
          }
        }
      }
    } catch (err) {
      loadingEl.innerHTML = `<p style="color:#f85149">Failed to load PDF: ${err.message}</p>`;
      console.error(err);
    }
  }

  async function renderSlide(pdf, pageNum, totalPages) {
    const page = await pdf.getPage(pageNum);

    const viewportBase = page.getViewport({ scale: 1 });
    const desiredWidth = Math.min(920, window.innerWidth - 40);
    const scale  = desiredWidth / viewportBase.width;
    const viewport = page.getViewport({ scale });

    // --- Wrapper ---
    const wrapper = document.createElement('div');
    wrapper.className = 'slide-wrapper';
    wrapper.id = `slide-${pageNum}`;
    slideWrappers.push(wrapper);

    // --- Header bar ---
    const hdr = document.createElement('div');
    hdr.className = 'slide-header';
    hdr.innerHTML = `<span class="slide-number">Slide ${pageNum} / ${totalPages}</span>`;
    wrapper.appendChild(hdr);

    // --- Canvas ---
    const canvasContainer = document.createElement('div');
    canvasContainer.className = 'canvas-container';

    const canvas = document.createElement('canvas');
    canvas.className = 'slide-canvas';
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    canvasContainer.appendChild(canvas);

    // --- Play overlay ---
    const overlay = document.createElement('div');
    overlay.className = 'play-overlay';
    overlay.title = 'Click to listen to the team explain';
    overlay.innerHTML = `
      <div class="listen-label">&#9664; Click to listen to the team explain</div>
      <div class="play-btn"><img src="play%20button.jpeg" alt="Play" /></div>
    `;

    // --- Audio panel ---
    const audioPanel = document.createElement('div');
    audioPanel.className = 'audio-panel';

    const audioLabel = document.createElement('span');
    audioLabel.className = 'audio-label';
    audioLabel.textContent = `Slide ${pageNum}`;

    const audioEl = document.createElement('audio');
    audioEl.controls = true;
    audioEl.src = `${pageNum}.ogg`;

    const closeBtn = document.createElement('button');
    closeBtn.className = 'close-audio';
    closeBtn.innerHTML = '&#10005;';
    closeBtn.title = 'Close';
    closeBtn.addEventListener('click', () => {
      audioEl.pause();
      audioEl.currentTime = 0;
      audioPanel.classList.remove('visible');
    });

    audioPanel.appendChild(audioLabel);
    audioPanel.appendChild(audioEl);
    audioPanel.appendChild(closeBtn);

    // --- Click handler on play overlay ---
    overlay.addEventListener('click', () => {
      // Stop any other playing audio
      if (currentAudio && currentAudio !== audioEl) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        document.querySelectorAll('.audio-panel.visible').forEach(p => {
          if (p !== audioPanel) p.classList.remove('visible');
        });
      }
      audioPanel.classList.add('visible');
      audioEl.play().catch(() => {});
      currentAudio = audioEl;
      wrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    canvasContainer.appendChild(overlay);
    wrapper.appendChild(canvasContainer);
    wrapper.appendChild(audioPanel);
    container.appendChild(wrapper);

    // Render PDF page
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  }

  loadPDF();
</script>
</body>
</html>
